<!doctype html>
<html lang="tr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>MotionLab VR — Webcam Motion Demo</title>
  <style>
    :root { --bg:#080b10; --panel:#111722; --line:#293242; --text:#eaf0f7; --muted:#9aa8ba; --accent:#63e6ff; }
    *{box-sizing:border-box}
    body{margin:0;background:radial-gradient(circle at 50% 10%,#16202d 0,#080b10 52%);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;overflow:hidden;min-height:100svh}
    #ui{position:fixed;inset:0;pointer-events:none}
    .top{position:absolute;top:14px;left:14px;right:14px;display:flex;justify-content:space-between;gap:10px}
    .panel{pointer-events:auto;background:rgba(12,17,25,.88);border:1px solid var(--line);border-radius:14px;padding:12px 14px;backdrop-filter:blur(12px);box-shadow:0 10px 35px #0007}
    h1{font-size:15px;margin:0 0 4px;letter-spacing:.08em;text-transform:uppercase}
    .sub{font-size:12px;color:var(--muted)}
    button{border:1px solid #385164;background:#132330;color:#dff8ff;border-radius:10px;padding:9px 12px;font-weight:700;cursor:pointer}
    button:hover{background:#183042}
    #hud{position:absolute;left:14px;bottom:14px;max-width:330px}
    #status{font-size:13px;line-height:1.45}
    #cam{position:absolute;right:14px;bottom:14px;width:240px;aspect-ratio:16/9;object-fit:cover;border-radius:12px;border:1px solid var(--line);transform:scaleX(-1);opacity:.55;background:#05070a}
    #cross{position:absolute;left:50%;top:50%;width:18px;height:18px;transform:translate(-50%,-50%);opacity:.75}
    #cross:before,#cross:after{content:"";position:absolute;background:#dff8ff}
    #cross:before{width:18px;height:1px;top:9px}
    #cross:after{height:18px;width:1px;left:9px}
    #help{margin-top:7px;color:var(--muted);font-size:11px}
    canvas{display:block}
  </style>
</head>
<body>
<video id="cam" autoplay muted playsinline></video>
<div id="ui">
  <div class="top">
    <div class="panel"><h1>MotionLab VR</h1><div class="sub">Webcam-driven physics sandbox demo</div></div>
    <div class="panel"><button id="start">Kamerayı Başlat</button> <button id="reset">Sahneyi Sıfırla</button></div>
  </div>
  <div id="hud" class="panel">
    <div id="status">Kamera kapalı. “Kamerayı Başlat” ile hareket takibini aç.</div>
    <div id="help">İki elini kameraya göster. Ellerinin konumu avatarın ellerine, dirsek/omuz yönleri avatar kollarına aktarılır. Nesnelere yaklaşınca fiziksel itme uygulanır.</div>
  </div>
  <div id="cross"></div>
</div>

<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js";
import {OrbitControls} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js";
import {GLTFLoader} from "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js";
import {FilesetResolver, HandLandmarker, PoseLandmarker}
  from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/+esm";

const video = document.querySelector('#cam');
const status = document.querySelector('#status');
const startBtn = document.querySelector('#start');
const resetBtn = document.querySelector('#reset');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070a0e);
scene.fog = new THREE.Fog(0x070a0e, 8, 28);

const camera = new THREE.PerspectiveCamera(70, innerWidth/innerHeight, .03, 100);
camera.position.set(0,1.65,5.4);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled = true;
document.body.appendChild(renderer.domElement);

const controls = new OrbitControls(camera, renderer.domElement);
controls.target.set(0,1.35,0);
controls.enableDamping = true;

scene.add(new THREE.HemisphereLight(0x9edcff,0x151515,2.1));
const key = new THREE.DirectionalLight(0xffffff,3);
key.position.set(3,6,4); key.castShadow=true; scene.add(key);

const floor = new THREE.Mesh(new THREE.BoxGeometry(12,.25,12),new THREE.MeshStandardMaterial({color:0x171d25,roughness:.88}));
floor.position.y=-.12; floor.receiveShadow=true; scene.add(floor);

const grid = new THREE.GridHelper(12,24,0x30404c,0x1b242e);
grid.position.y=.01; scene.add(grid);

const wallMat = new THREE.MeshStandardMaterial({color:0x202936,roughness:.7});
for(const [x,y,z,s] of [[0,2,-5,[10,4,.2]],[-5,2,0,[.2,4,10]],[5,2,0,[.2,4,10]]]){
  const m=new THREE.Mesh(new THREE.BoxGeometry(...s),wallMat);m.position.set(x,y,z);m.receiveShadow=true;scene.add(m);
}

const avatar = new THREE.Group(); scene.add(avatar);
const matBody = new THREE.MeshStandardMaterial({color:0x9aa6b2,roughness:.65,metalness:.15});
const matJoint = new THREE.MeshStandardMaterial({color:0x52d9ef,emissive:0x073b46,roughness:.4});
const matHand = new THREE.MeshStandardMaterial({color:0xeffaff,roughness:.35});

function capsule(a,b,r,mat){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  const m=new THREE.Mesh(new THREE.CapsuleGeometry(r,Math.max(.001,len-r*2),8,12),mat);
  m.position.copy(a.clone().add(b).multiplyScalar(.5));
  m.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
  m.castShadow=true; return m;
}
function sphere(r,mat){const m=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),mat);m.castShadow=true;return m}

const joints={head:sphere(.18,matBody), neck:sphere(.11,matJoint),
  lShoulder:sphere(.11,matJoint),rShoulder:sphere(.11,matJoint),
  lElbow:sphere(.105,matJoint),rElbow:sphere(.105,matJoint),
  lHand:sphere(.14,matHand),rHand:sphere(.14,matHand)};
Object.values(joints).forEach(x=>avatar.add(x));

const segments=[];
function seg(name){const m=capsule(new THREE.Vector3(),new THREE.Vector3(0,1,0),.09,matBody);m.name=name;avatar.add(m);segments.push(m);return m}
const segs={
  torso:seg('torso'), lUpper:seg('lUpper'),rUpper:seg('rUpper'),lFore:seg('lFore'),rFore:seg('rFore')
};

function setBone(mesh,a,b,r=.09){
  const dir=new THREE.Vector3().subVectors(b,a), len=dir.length();
  mesh.position.copy(a.clone().add(b).multiplyScalar(.5));
  mesh.scale.set(1,Math.max(.001,(len-r*2)/1),1);
  mesh.quaternion.setFromUnitVectors(new THREE.Vector3(0,1,0),dir.normalize());
}

const chest=new THREE.Mesh(new THREE.BoxGeometry(.62,.72,.30),matBody);
chest.position.y=1.25; chest.castShadow=true; avatar.add(chest);
const head=joints.head; head.position.set(0,1.86,0);
joints.neck.position.set(0,1.66,0);

function addInteractable(pos,color=0xffc857){
  const o=new THREE.Mesh(new THREE.SphereGeometry(.16,20,16),new THREE.MeshStandardMaterial({color,roughness:.35,metalness:.15}));
  o.position.copy(pos);o.castShadow=true;o.userData.vel=new THREE.Vector3();o.userData.grabbed=false;scene.add(o);objects.push(o);return o;
}
let objects=[];
function resetObjects(){
  objects.forEach(o=>scene.remove(o));objects=[];
  addInteractable(new THREE.Vector3(-1.1,1.2,-1.2),0xffb74d);
  addInteractable(new THREE.Vector3(1.1,1.05,-1.0),0x7ee787);
  addInteractable(new THREE.Vector3(0,2.3,-1.7),0xa78bfa);
}
resetObjects();

let tracking=false, latest={left:null,right:null,pose:null};
let mpHands=null, mpPose=null;

function mapHand(p){
  // MediaPipe normalized image -> world-ish coordinates relative to avatar.
  return new THREE.Vector3((0.5-p.x)*4.2, (1-p.y)*2.7+.15, -p.z*2.0-1.2);
}
function smooth(target,current,alpha=.35){return current?current.lerp(target,alpha):target.clone()}

function applyTracking(){
  if(!latest.pose && !latest.left && !latest.right) return;
  const baseY=1.35;
  const L=latest.left?.[0], R=latest.right?.[0];
  if(L){ joints.lHand.position.copy(smooth(mapHand(L),joints.lHand.position)); }
  if(R){ joints.rHand.position.copy(smooth(mapHand(R),joints.rHand.position)); }

  // Estimate elbows from hand positions; this keeps the demo robust even when pose tracking drops.
  const lp=joints.lHand.position, rp=joints.rHand.position;
  joints.lShoulder.position.set(-.32,1.55,0);
  joints.rShoulder.position.set(.32,1.55,0);
  joints.lElbow.position.lerp(new THREE.Vector3((lp.x-.32)*.48-.12, Math.max(1.05,lp.y+.20), lp.z*.45),.28);
  joints.rElbow.position.lerp(new THREE.Vector3((rp.x+.32)*.48+.12, Math.max(1.05,rp.y+.20), rp.z*.45),.28);

  setBone(segs.lUpper,joints.lShoulder.position,joints.lElbow.position);
  setBone(segs.rUpper,joints.rShoulder.position,joints.rElbow.position);
  setBone(segs.lFore,joints.lElbow.position,joints.lHand.position);
  setBone(segs.rFore,joints.rElbow.position,joints.rHand.position);

  const shoulderMid=new THREE.Vector3().addVectors(joints.lShoulder.position,joints.rShoulder.position).multiplyScalar(.5);
  setBone(segs.torso,new THREE.Vector3(0,.92,0),shoulderMid,.14);

  // Hand proximity -> simple grab/push sandbox interaction.
  for(const hand of [joints.lHand,joints.rHand]){
    for(const o of objects){
      const d=hand.position.distanceTo(o.position);
      if(d<.30){
        const impulse=new THREE.Vector3().subVectors(o.position,hand.position).normalize().multiplyScalar(.028);
        o.userData.vel.add(impulse);
      }
    }
  }
}

function physics(){
  for(const o of objects){
    o.userData.vel.y-=.0008;
    o.position.add(o.userData.vel);
    o.userData.vel.multiplyScalar(.985);
    if(o.position.y<.16){o.position.y=.16;o.userData.vel.y*=-.55}
    if(Math.abs(o.position.x)>4.6){o.position.x=Math.sign(o.position.x)*4.6;o.userData.vel.x*=-.65}
    if(Math.abs(o.position.z)>4.6){o.position.z=Math.sign(o.position.z)*4.6;o.userData.vel.z*=-.65}
  }
}

async function loadModels(){
  // Optional future extension point: drop a rigged GLB into /assets and replace the primitive avatar.
  // The demo intentionally uses primitives so it works as a single HTML file.
}

async function startCamera(){
  startBtn.disabled=true;
  status.textContent='Kamera hazırlanıyor...';

  try{
    if(!window.isSecureContext || !navigator.mediaDevices?.getUserMedia){
      throw new Error('SECURE_CONTEXT_REQUIRED');
    }

    const stream=await navigator.mediaDevices.getUserMedia({
      video:{facingMode:{ideal:'user'},width:{ideal:1280},height:{ideal:720}},
      audio:false
    });

    video.srcObject=stream;
    await video.play();

    status.textContent='Kamera açıldı. El takip sistemi yükleniyor...';
    await initMediaPipe();

    tracking=true;
    status.innerHTML='Kamera aktif. Ellerini kameraya göster — avatarın kolları hareketlerini takip ediyor.';
    requestAnimationFrame(trackFrame);
  }catch(e){
    console.error(e);
    if(e.message==='SECURE_CONTEXT_REQUIRED'){
      status.innerHTML='⚠️ Kamera için bu sayfayı HTTPS üzerinden açmalısın. Dosyayı doğrudan açmak yerine bir HTTPS web sunucusunda çalıştır.';
    }else if(e.name==='NotAllowedError'){
      status.textContent='⚠️ Kamera izni reddedildi. Safari ayarlarından bu site için Kamera iznini aç.';
    }else if(e.name==='NotFoundError'){
      status.textContent='⚠️ Kamera bulunamadı.';
    }else{
      status.textContent='⚠️ Kamera veya takip sistemi başlatılamadı: '+(e.message||e);
    }
  }finally{
    startBtn.disabled=false;
  }
}

async function initMediaPipe(){
  const vision=await FilesetResolver.forVisionTasks(
    'https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.22/wasm'
  );

  mpHands=await HandLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task',
      delegate:'GPU'
    },
    runningMode:'VIDEO',
    numHands:2
  });

  mpPose=await PoseLandmarker.createFromOptions(vision,{
    baseOptions:{
      modelAssetPath:'https://storage.googleapis.com/mediapipe-models/pose_landmarker/pose_landmarker_lite/float16/1/pose_landmarker_lite.task',
      delegate:'GPU'
    },
    runningMode:'VIDEO',
    numPoses:1
  });
}

let lastVideoTime=-1;
async function trackFrame(t){
  if(!tracking || video.readyState<2){requestAnimationFrame(trackFrame);return}
  if(video.currentTime!==lastVideoTime){
    lastVideoTime=video.currentTime;
    try{
      const h=mpHands?.detectForVideo(video,t);
      const p=mpPose?.detectForVideo(video,t);
      latest.left=null;latest.right=null;
      if(h?.landmarks){
        for(let i=0;i<h.landmarks.length;i++){
          const handed=h.handednesses[i]?.[0]?.categoryName;
          if(handed==='Left') latest.left=h.landmarks[i];
          else if(handed==='Right') latest.right=h.landmarks[i];
        }
      }
      latest.pose=p?.landmarks?.[0]||null;
      applyTracking();
    }catch(e){console.warn(e)}
  }
  requestAnimationFrame(trackFrame);
}

startBtn.onclick=startCamera;
resetBtn.onclick=resetObjects;
addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});

const clock=new THREE.Clock();
function animate(){
  requestAnimationFrame(animate);
  physics();
  controls.update();
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
